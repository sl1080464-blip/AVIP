[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avip"
version = "0.1.0"
description = "AVIP - AI Vision Intelligence Platform foundation"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "AVIP contributors" }]
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "pydantic>=2.9.0,<3.0.0",
  "pydantic-settings>=2.3.0,<3.0.0",
  "sqlalchemy>=2.0.0,<3.0.0",
  "alembic>=1.13.0,<2.0.0",
  "uvicorn>=0.30.0,<1.0.0",
  "psycopg[binary]>=3.1.0,<4.0.0",
  "redis>=5.0.0,<6.0.0",
  "python-dotenv>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
  "ruff==0.6.9",
  "mypy==1.10.0",
  "pytest==8.3.2",
  "pytest-cov==5.0.0",
  "httpx==0.27.0",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = [".", "backend"]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "B", "I"]

[tool.mypy]
python_version = "3.12"
files = ["backend"]
warn_unused_configs = true
