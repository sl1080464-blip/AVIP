version: "3.9"

services:
  backend:
    build:
      context: .
    container_name: avip-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: avip-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    container_name: avip-postgres
    environment:
      POSTGRES_DB: avip
      POSTGRES_USER: avip
      POSTGRES_PASSWORD: avip
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: avip-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
